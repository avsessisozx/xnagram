name: Release Build

on:
  push:
    branches:
      - main
      - gelistirme
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Prepare signing
        id: signing
        env:
          XN_KEYSTORE_B64: ${{ secrets.XN_KEYSTORE_B64 }}
          XN_KEYSTORE_PASS: ${{ secrets.XN_KEYSTORE_PASS }}
          XN_KEY_ALIAS: ${{ secrets.XN_KEY_ALIAS }}
          XN_KEY_PASS: ${{ secrets.XN_KEY_PASS }}
        run: |
          KS=TMessagesProj/release.keystore
          if [ -n "$XN_KEYSTORE_B64" ]; then
            echo "$XN_KEYSTORE_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASS=$XN_KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ALIAS_NAME=$XN_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ALIAS_PASS=$XN_KEY_PASS" >> "$GITHUB_ENV"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          else
            # Throwaway key for test builds only: APKs signed with it cannot be updated by a later stable build.
            TMP_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -storepass "$TMP_PASS" -keypass "$TMP_PASS" \
              -alias xntemp -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=XNagram test"
            echo "KEYSTORE_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "ALIAS_NAME=xntemp" >> "$GITHUB_ENV"
            echo "ALIAS_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "kind=temporary" >> "$GITHUB_OUTPUT"
          fi
      - name: Release Build
        id: build
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release-arm64-v8a-${{ steps.signing.outputs.kind }}
          path: TMessagesProj/build/outputs/apk/release/*-arm64-v8a.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERCODE=$(grep -oP 'def verCode = \K[0-9]+' TMessagesProj/build.gradle)
          VERNAME=$(grep -oP '^APP_VERSION_NAME=\K.*' gradle.properties)
          if [ -f RELEASE_NOTES.md ]; then NOTES=RELEASE_NOTES.md; else echo "XNagram $VERNAME" > /tmp/notes.md; NOTES=/tmp/notes.md; fi
          gh release create "v$VERCODE" TMessagesProj/build/outputs/apk/release/*-arm64-v8a.apk \
            --title "XNagram $VERNAME ($VERCODE)" --notes-file "$NOTES" --target "$GITHUB_SHA"
